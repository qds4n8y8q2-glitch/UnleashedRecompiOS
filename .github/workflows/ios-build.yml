name: Build Sonic Unleashed iOS
on:
  workflow_dispatch: # This creates the "Run workflow" button

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive # Grabs the graphics engine (MoltenVK)

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.0' # Matches the 2026 dev environment

      - name: Install Dependencies
        run: |
          brew install freetype


      - name: Prepare Build
        run: |
          mkdir -p build
          cd build
          # This command points the engine to the Apple graphics language (Metal)
          cmake .. -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64

      - name: Compile Game Engine
        run: |
          cd build
          # We only build the Release version to keep the file size smaller
          xcodebuild -scheme UnleashedRecomp -configuration Release -sdk iphoneos build CODE_SIGNING_ALLOWED=NO

      - name: Package for Sideloading
        run: |
          cd build/Release-iphoneos
          mkdir -p Payload
          # Moves the compiled app into a folder that Sideloadly can read
          cp -r UnleashedRecomp.app Payload/
          zip -r Unleashed.ipa Payload/

      - name: Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: Unleashed-Mobile-Build
          path: build/Release-iphoneos/Unleashed.ipa
